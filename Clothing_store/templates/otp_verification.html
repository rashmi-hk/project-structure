<!DOCTYPE html>
<html>
<head>
    <title>Verify OTP</title>
</head>
<body>
   <div class="page-wrapper bg-red p-t-180 p-b-100 font-robo">
    <div class="wrapper wrapper--w960">
        <div class="card card-2">
            <div class="card-heading"></div>
            <div class="card-body">
            <h2 class="title text-center">Verify OTP</h2>
                <form id="otpForm" method="post" action="/verify_otp">
                    {% csrf_token %}
                    <label for="otp" style="font-weight: bold; font-size: 18px;">Enter OTP:</label>
                    <input type="text" style="width: 260px; height: 40px; border: 1px solid; font-size: 18px; margin: 4% 0%;" name="otp" id="otp" required><br>

                    <input type="submit" style="background-color: green; color: white; width: 140px; height: 35px; font-weight: bold;" value="Verify">
                </form>
            </div>
        </div>
    </div>
    </div>
    </div>
</body>
</html>
